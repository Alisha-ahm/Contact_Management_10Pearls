sonar.projectKey=contact-management-system
sonar.projectName=Contact Management System (Java + React)
sonar.projectVersion=1.0.0

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.source=17
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Java & JavaScript/TypeScript Quality Rules Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**
sonar.cpd.exclusions=**/dto/**
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.java
